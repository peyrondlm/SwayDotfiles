# Window rules for sway.
#
# NOTE: sway distinguishes Wayland apps (`app_id`) from X11 apps running
# under XWayland (`class`). Rules are duplicated so they match either.

# Floating windows
for_window [app_id="qimgv"] floating enable
for_window [class="qimgv"] floating enable
for_window [app_id="pavucontrol"] floating enable
for_window [class="Pavucontrol"] floating enable
for_window [app_id="mpv"] floating enable, sticky enable
for_window [class="mpv"] floating enable, sticky enable
for_window [app_id="galculator"] floating enable, sticky enable
for_window [class="Galculator"] floating enable, sticky enable
for_window [app_id="nwg-look"] floating enable
for_window [class="Nwg-look"] floating enable

# Set floating window size
for_window [floating] resize set 1600 900
for_window [floating] move position center

# Scratchpad windows
for_window [app_id="scratchpad"] floating enable, move scratchpad, scratchpad show, resize set 1200 800, move position center
for_window [class="scratchpad"] floating enable, move scratchpad, scratchpad show, resize set 1200 800, move position center
for_window [app_id="pulsemixer"] floating enable, move scratchpad, scratchpad show, resize set 1000 600, move position center
for_window [class="pulsemixer"] floating enable, move scratchpad, scratchpad show, resize set 1000 600, move position center

# Floating windows keep a visible border. Sway otherwise falls back to CSD
# when a window is toggled to floating.
for_window [floating] border pixel 4
