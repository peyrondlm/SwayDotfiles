# Idle timings and behaviour.

# Seconds before locking the screen (0 disables).
LOCK_TIMEOUT=300

# Seconds before turning the display off (0 disables).
DPMS_TIMEOUT=600

# Seconds of silence before rearming the idle timers.
MEDIA_GRACE=30

# Audio check interval, in seconds.
POLL_INTERVAL=15

# Inhibit idle while a fullscreen window is focused (0/1).
INHIBIT_FULLSCREEN=0
