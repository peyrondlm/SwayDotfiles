# Alacritty configuration.

[general]
import = ["~/.config/alacritty/current-theme.toml"]

[window]
padding = { x = 10, y = 10 }
dynamic_padding = true
decorations = "none"
opacity = 0.85

[scrolling]
history = 10000

[cursor]
style = { shape = "Block", blinking = "On" }

[cursor.vi_mode_style]
shape = "Block"
blinking = "Off"

[font]
size = 12.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

[window.dimensions]
columns = 100
lines = 28
